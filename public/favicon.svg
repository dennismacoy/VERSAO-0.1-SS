<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#009A44" />
      <stop offset="100%" stop-color="#00662A" />
    </linearGradient>
    
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="6" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="110" fill="url(#bg-green)" />

  <text 
    x="41%" 
    y="50%" 
    font-family="Impact, 'Arial Black', sans-serif" 
    font-weight="900" 
    font-style="italic"
    font-size="380" 
    fill="#FF5900" 
    stroke="#FFFFFF"
    stroke-width="18"
    stroke-linejoin="round"
    text-anchor="middle" 
    dominant-baseline="central" 
    letter-spacing="-12"
    filter="url(#shadow)">
    SS
